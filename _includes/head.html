  <!-- Bahasa pilihan pembaca (EN / ID / FA / ZH): dibaca sebelum halaman tampil agar tidak berkedip -->
  <script>
    (function(){
      var ok = {en:1, id:1, fa:1, zh:1};
      var tags = {en:'en', id:'id', fa:'fa-AF', zh:'zh-Hans'};
      var lang = 'en';
      try{
        var saved = localStorage.getItem('elioraLang');
        if(ok[saved]){ lang = saved; }
        else{
          var p = ((navigator.language || '') + '').toLowerCase().split('-')[0];
          if(p === 'prs'){ p = 'fa'; }
          if(ok[p]){ lang = p; }
        }
      }catch(e){}
      document.documentElement.setAttribute('data-lang', lang);
      document.documentElement.setAttribute('lang', tags[lang]);
    })();
  </script>
