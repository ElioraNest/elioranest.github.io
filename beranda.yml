artikel_akhir_pekan: |
  <h3><span class="t-en">What Causes Sin in the Process of Renewal</span><span class="t-id">Penyebab Dosa dalam Proses Pembaruan</span><span class="t-fa" lang="fa-AF">علت گناه در روند تجدید</span><span class="t-zh" lang="zh-Hans">更新过程中犯罪的原因</span></h3>
  <p class="weekend-meta t-en">Pastor Eric Chang, Chapter 9 of Becoming a New Person. Source: Cahaya Pengharapan Ministries. Article in Indonesian.</p>
  <p class="weekend-meta t-id">Pastor Eric Chang, Bab 9 dari Becoming a New Person. Sumber: Cahaya Pengharapan Ministries. Artikel dalam bahasa Indonesia.</p>
  <p class="weekend-meta t-fa" lang="fa-AF">پاستور اریک چانگ، فصل ۹ از کتاب Becoming a New Person. منبع: Cahaya Pengharapan Ministries. مقاله به زبان اندونزیایی.</p>
  <p class="weekend-meta t-zh" lang="zh-Hans">张宏兴牧师（Eric Chang），《Becoming a New Person》第9章。来源：Cahaya Pengharapan Ministries。文章为印尼文。</p>
  <p class="t-en">Why do we still fall, even when we know what is right? This writing looks at four things that can hold back our renewal: the pull of the world, the inability to tell good from evil, old habits of thinking, and a lack of knowledge. Renewal begins with honestly looking at ourselves.</p>
  <p class="t-id">Mengapa kita masih jatuh, padahal kita tahu apa yang benar? Tulisan ini membahas empat hal yang dapat menghambat pembaruan kita: daya tarik dunia, ketidakmampuan membedakan yang baik dan yang jahat, kebiasaan berpikir yang lama, serta kurangnya pengetahuan. Pembaruan dimulai dari kejujuran melihat diri sendiri.</p>
  <p class="t-fa" lang="fa-AF">چرا با آنکه می‌دانیم چه درست است، باز هم می‌لغزیم؟ این نوشته چهار چیز را بررسی می‌کند که می‌تواند جلوی تجدید ما را بگیرد: کشش دنیا، ناتوانی در تشخیص نیک از بد، عادت‌های کهنهٔ فکری، و کمبود شناخت. تجدید با نگاهی صادقانه به خودمان آغاز می‌شود.</p>
  <p class="t-zh" lang="zh-Hans">为什么我们明知何为正确，却仍会跌倒？本文探讨可能阻碍我们更新的四件事：世界的吸引、无法分辨善恶、旧有的思维习惯，以及知识的缺乏。更新始于诚实地审视自己。</p>
