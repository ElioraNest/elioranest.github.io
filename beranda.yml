  <div class="t-en"><p>“No one who abides in him keeps on sinning.”</p><span class="verse-ref">1 John 3:6 (ESV)</span></div>
  <div class="t-id"><p>“Setiap orang yang tinggal dalam Dia tidak terus menerus berbuat dosa.”</p><span class="verse-ref">1 Yohanes 3:6 (AYT)</span></div>
  <div class="t-fa" lang="fa-AF"><p>«هر که در او می‌ماند، پیوسته گناه نمی‌کند.»</p><span class="verse-ref">اول یوحنا ۳:۶</span></div>
  <div class="t-zh" lang="zh-Hans"><p>“凡住在他里面的人，不会继续犯罪。”</p><span class="verse-ref">约翰一书 3:6</span></div>
kata_ibrani: |
  <p class="hebrew-word" lang="he" dir="rtl">חָכְמָה</p>
  <p class="hebrew-translit">Chokhmah</p>
  <p class="t-en">Wisdom. It describes the ability to understand, discern, and act rightly, not merely to possess knowledge.</p>
  <p class="t-id">Hikmat atau kebijaksanaan. Kata ini menggambarkan kemampuan untuk memahami, membedakan yang benar, dan bertindak dengan tepat, bukan sekadar memiliki pengetahuan.</p>
  <p class="t-fa" lang="fa-AF">حکمت. این واژه توانایی فهمیدن، تشخیص دادن و درست عمل کردن را توصیف می‌کند، نه فقط داشتن دانش را.</p>
  <p class="t-zh" lang="zh-Hans">智慧。这个词描述的是理解、分辨并正确行事的能力，而不仅仅是拥有知识。</p>
  <p class="t-en">“The fear of the LORD is the beginning of wisdom, and the knowledge of the Holy One is insight.”<span class="verse-ref">Proverbs 9:10 (ESV)</span></p>
  <p class="t-id">“Permulaan hikmat adalah takut akan TUHAN, dan mengenal Yang Mahakudus adalah pengertian.”<span class="verse-ref">Amsal 9:10 (TB)</span></p>
  <p class="t-fa" lang="fa-AF">«ترس خداوند آغاز حکمت است، و شناخت آن قدوس، فهم است.»<span class="verse-ref">امثال ۹:۱۰</span></p>
  <p class="t-zh" lang="zh-Hans">“敬畏耶和华是智慧的开端，认识至圣者便是聪明。”<span class="verse-ref">箴言 9:10</span></p>
